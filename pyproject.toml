[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "indoor-positioning-rtls"
version = "1.0.0"
description = "Real-Time Indoor BLE Positioning, Machine Learning & Telemetry Operations System"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Dissertation Research Team" }
]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "websockets>=12.0",
    "pydantic>=2.0.0",
    "requests>=2.28.0",
    "pyserial>=3.5",
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "joblib>=1.3.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0"
]

[project.optional-dependencies]
ml-advanced = [
    "xgboost>=2.0.0",
    "catboost>=1.2.0",
    "lightgbm>=4.0.0"
]
dev = [
    "pytest>=8.0.0",
    "anyio>=4.0.0"
]

[project.scripts]
rtls-control = "control:main"
rtls-controller = "controller:main"
rtls-setup = "setup:main"
rtls-trainer = "trainer_gui:main"
rtls-admin = "admin_gui:main"

[tool.pytest.ini_options]
testpaths = ["ble-indoor-positioning/tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning"
]
