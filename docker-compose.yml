version: '3.8'

services:
  # Enterprise Indoor Positioning Location Engine & Telemetry Service
  location-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ble_location_engine
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=8000
      - DATABASE_URL=sqlite:////app/ble-indoor-positioning/models/position_history.db
    volumes:
      - model-data:/app/ble-indoor-positioning/models
      - dataset-data:/app/ble-indoor-positioning/datasets
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  model-data:
    driver: local
  dataset-data:
    driver: local
